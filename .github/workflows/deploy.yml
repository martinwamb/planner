name: Deploy to home server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Reach the server through the Cloudflare tunnel
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb > /dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf 'Host *\n  ProxyCommand cloudflared access ssh --hostname %%h\n  ServerAliveInterval 30\n' >> ~/.ssh/config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cat > /tmp/deploy.sh <<'DEPLOY_SCRIPT'
          set -e
          echo "=== Deploying planner ==="
          cd ~/apps/planner

          git fetch --prune
          git checkout main
          git pull --ff-only origin main

          cd server
          echo "--- Installing dependencies ---"
          npm install

          echo "--- Restarting PM2 process ---"
          cd ~/apps/planner
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save

          echo "=== Deploy complete ==="
          DEPLOY_SCRIPT
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'f=$(mktemp) && cat > "$f" && bash "$f" < /dev/null; rc=$?; rm -f "$f"; exit $rc' < /tmp/deploy.sh
